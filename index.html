<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fafafa;
    }
    #rotator {
      position: absolute;
      top: 50%;
      left: 50%;
      /* Forzamos la resolución estándar de TV en vertical */
      width: 1080px;
      height: 1920px;
      transform: translate(-50%, -50%) rotate(-90deg);
    }
    iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      display: block;
    }
  </style>
