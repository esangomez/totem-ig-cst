<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totem Instagram - Colegio Santo Tomás</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fafafa;
    }
    #rotator {
      position: absolute;
      top: 50%;
      left: 50%;
      /* Tamaño relativo a la pantalla real (no fijo), para que se adapte
         sin importar la resolución exacta que reporte el Fire Stick */
      width: 100vh;
      height: 100vw;
      transform: translate(-50%, -50%) rotate(-90deg);
    }
    iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      display: block;
    }
    /* Capa invisible encima del widget: intercepta TODOS los clics
       para que nunca lleguen al iframe (y por lo tanto nunca naveguen
       a Instagram), y en cambio disparen pantalla completa. */
    #clickCatcher {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
      cursor: default;
    }
    /* Barra fija abajo de la pantalla física (no rota con el contenido) */
    #footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 14px 10px;
      background-color: #E1653C;
      color: #ffffff;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      font-weight: bold;
      z-index: 20;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div id="rotator">
    <script src="https://cdn.lightwidget.com/widgets/lightwidget.js"></script>
    <iframe
      id="feed"
      src="https://lightwidget.com/widgets/87ec422e4d4f5a3793c65eb7e0b237bc.html"
      scrolling="no"
      allowtransparency="true"
      class="lightwidget-widget">
    </iframe>
    <div id="clickCatcher" tabindex="0" onclick="activarPantallaCompleta()"></div>
  </div>

  <div id="footer">📷 Mirá esta publicación en Instagram — @colegiosantotomas.escobar</div>

  <script>
    // Intenta activar pantalla completa apenas carga la página
    // (algunos navegadores de TV lo permiten sin necesidad de clic)
    window.addEventListener('load', function () {
      activarPantallaCompleta();
      // Le da foco a la capa para que el botón central del control
      // remoto del Fire Stick pueda activarla directamente
      document.getElementById('clickCatcher').focus();
    });

    // Responde también al botón central/OK del control remoto (tecla Enter)
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.keyCode === 13) {
        activarPantallaCompleta();
      }
    });

    setTimeout(function () {
      window.location.reload();
    }, 30 * 60 * 1000);

    // Función para pantalla completa
    function activarPantallaCompleta() {
      let elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }
  </script>

</body>
</html>
