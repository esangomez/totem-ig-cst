<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totem Instagram - Colegio Santo Tomás</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fafafa;
    }
    #rotator {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vh;
      height: 100vw;
      transform: translate(-50%, -50%) rotate(-90deg);
      display: flex;
      flex-direction: column;
    }
    #content {
      position: relative;
      flex: 1;
      width: 100%;
    }
    iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      display: block;
    }
    #clickCatcher {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
      cursor: default;
    }
    #footerBar {
      width: 100%;
      height: 70px;
      flex-shrink: 0;
      background-color: #E1653C;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #footerBar span {
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 20px;
      text-align: center;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <div id="rotator">
    <div id="content">
      <script src="https://cdn.lightwidget.com/widgets/lightwidget.js"></script>
      <iframe
        id="feed"
        src="https://lightwidget.com/widgets/87ec422e4d4f5a3793c65eb7e0b237bc.html"
        scrolling="no"
        allowtransparency="true"
        class="lightwidget-widget">
      </iframe>
      <div id="clickCatcher" tabindex="0" onclick="activarPantallaCompleta()"></div>
    </div>
    <div id="footerBar">
      <span>📷 Mirá esta publicación en Instagram — @colegiosantotomas.escobar</span>
    </div>
  </div>

  <script>
    window.addEventListener('load', function () {
      activarPantallaCompleta();
      document.getElementById('clickCatcher').focus();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.keyCode === 13) {
        activarPantallaCompleta();
      }
    });

    setTimeout(function () {
      window.location.reload();
    }, 30 * 60 * 1000);

    function activarPantallaCompleta() {
      let elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }
  </script>

</body>
</html>
