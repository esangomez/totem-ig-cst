<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totem Instagram - Colegio Santo Tomás</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <script src="https://cdn.lightwidget.com/widgets/lightwidget.js"></script>
  <iframe
    id="feed"
    src="https://lightwidget.com/widgets/87ec422e4d4f5a3793c65eb7e0b237bc.html"
    scrolling="no"
    allowtransparency="true"
    class="lightwidget-widget">
  </iframe>

  <script>
    // Recarga la página automáticamente cada 30 minutos
    // para asegurarse de que el feed y el navegador no se cuelguen
    setTimeout(function () {
      window.location.reload();
    }, 30 * 60 * 1000);
  </script>

</body>
</html>
